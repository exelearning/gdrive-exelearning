name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run ci

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Download eXeLearning editor
        run: make download-editor EXELEARNING_EDITOR_REF="$(tr -d '[:space:]' < .editor-version)"

      - name: Build production bundle
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ci-client-id.apps.googleusercontent.com
          VITE_GOOGLE_API_KEY: ci-api-key

      - name: Verify production bundle
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/open/index.html
          test -f dist/create/index.html
          test -n "$(find dist/editor -type f -print -quit)"
